apiVersion: apps/v1
kind: Deployment
metadata:
  name: summoner
  labels:
    app: summoner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summoner
  template:
    metadata:
      labels:
        app: summoner
    spec:
      containers:
        - name: summoner
          image: summoner:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          ports:
            - containerPort: 8080
              name: healthz
          envFrom:
            - secretRef:
                name: summoner-secrets
          env:
            - name: HOME
              value: /home/agent
            - name: WORK_DIR
              value: /nfs/shared
            - name: ARTIFACTS_DIR
              value: /nfs/shared/roundtable
            - name: INACTIVITY_TIMEOUT
              value: 20m
            - name: ROUNDTABLE_LEADER
              value: claude
          volumeMounts:
            - name: nfs-shared
              mountPath: /nfs/shared
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

        - name: discord-mcp-claude
          image: saseq/discord-mcp:latest
          imagePullPolicy: Always
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: BTCLAUDE_TOKEN
            - name: DISCORD_SERVER_ID
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: DISCORD_SERVER_ID
            - name: SPRING_PROFILES_ACTIVE
              value: http
            - name: SERVER_PORT
              value: "8085"

        - name: discord-mcp-gemini
          image: saseq/discord-mcp:latest
          imagePullPolicy: Always
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: BTGEMINI_TOKEN
            - name: DISCORD_SERVER_ID
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: DISCORD_SERVER_ID
            - name: SPRING_PROFILES_ACTIVE
              value: http
            - name: SERVER_PORT
              value: "8086"

        - name: discord-mcp-deepseek
          image: saseq/discord-mcp:latest
          imagePullPolicy: Always
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: BTDEEPSEEK_TOKEN
            - name: DISCORD_SERVER_ID
              valueFrom:
                secretKeyRef:
                  name: summoner-secrets
                  key: DISCORD_SERVER_ID
            - name: SPRING_PROFILES_ACTIVE
              value: http
            - name: SERVER_PORT
              value: "8087"

      volumes:
        - name: nfs-shared
          nfs:
            server: REPLACE_WITH_NFS_HOST
            path: /shared
---
apiVersion: v1
kind: Service
metadata:
  name: summoner
spec:
  selector:
    app: summoner
  ports:
    - port: 8080
      targetPort: 8080
      name: healthz
  type: ClusterIP
